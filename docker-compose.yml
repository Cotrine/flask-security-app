services:
  db:
    image: postgres:16-alpine
    container_name: seguridad_postgres_db
    restart: always
    environment:
      POSTGRES_DB: seguridad_db
      POSTGRES_USER: seguridad_user
      POSTGRES_PASSWORD: seguridad_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seguridad_user -d seguridad_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
